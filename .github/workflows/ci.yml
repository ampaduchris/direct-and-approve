name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the lockfile
        run: uv sync --locked
      - name: Tests
        run: uv run --locked pytest -q --tb=short
      - name: Requirement traceability
        run: uv run --locked python scripts/trace.py
      - name: Manifest check
        run: uv run --locked python scripts/extract.py --repo . --verify-manifest
      - name: Privacy boundary
        run: uv run --locked python scripts/boundary.py
      - name: Scrubber self-test and example-list scan
        run: uv run --locked python scripts/ci_checks.py scrub

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # REQ-003: no dependency is installed in this job and uv never syncs the project.
      - name: Scripts import with no dependencies installed
        run: uv run --no-project --isolated --python ${{ matrix.python-version }} python -I scripts/check_imports.py

  kit:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install from the lockfile
        run: uv sync --locked
      - name: Calibration proof
        run: uv run --locked python scripts/ci_checks.py kit

  start-your-own:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install from the lockfile
        run: uv sync --locked
      - name: Copy method/ outside the repository and run its checks
        run: uv run --locked python scripts/ci_checks.py start-your-own

  documents:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Install from the lockfile
        run: uv sync --locked
      - name: Blocks marked bash run
        run: uv run --locked python scripts/run_blocks.py
      # F-01 of review 9.4: the three README blocks must pass a second time, after the proof has run.
      - name: Blocks marked bash run, second time
        run: uv run --locked python scripts/run_blocks.py
      - name: Manifest check after the blocks
        run: uv run --locked python scripts/extract.py --repo . --verify-manifest
      - name: Offline link check
        run: uv run --locked python scripts/check_links.py

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
